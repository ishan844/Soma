<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Soma — V3.1</title>
<!-- Three.js for Vanilla WebGL Blob -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
  /* ─── RESET & FONTS ─── */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  
  :root {
    --font-title: 'Editorial New', Georgia, 'Times New Roman', serif;
    --font-body: 'Akkurat', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    --font-mono: 'Akkurat Mono', 'SF Mono', Menlo, monospace;

    /* Base Colors - Default to Calm (Soft, ambient) */
    --bg-base: #0B110E;
    --bg-gradient-1: rgba(27, 77, 62, 0.4);
    --bg-gradient-2: rgba(56, 123, 84, 0.2);
    
    --text-primary: rgba(255, 255, 255, 0.95);
    --text-secondary: rgba(255, 255, 255, 0.65);
    --text-muted: rgba(255, 255, 255, 0.4);

    --glass-bg: rgba(255, 255, 255, 0.03);
    --glass-border: rgba(255, 255, 255, 0.08);
    --glass-highlight: rgba(255, 255, 255, 0.12);
  }

  body {
    font-family: var(--font-body);
    background-color: var(--bg-base);
    color: var(--text-primary);
    min-height: 100vh;
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
    overscroll-behavior-y: none; 
  }

  /* ─── RICH AMBIENT BACKGROUND LAYER ─── */
  .bg-layer {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    z-index: 1;
    background:
      radial-gradient(ellipse 80% 50% at 50% 100%, var(--bg-gradient-1) 0%, transparent 70%),
      radial-gradient(ellipse 60% 40% at 30% 80%, var(--bg-gradient-2) 0%, transparent 60%),
      linear-gradient(180deg, #080810 0%, var(--bg-base) 100%);
    transition: background 1.5s ease;
  }
  
  .bg-noise {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    z-index: 2;
    opacity: 0.05;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
    pointer-events: none;
  }

  /* ─── FIXED THREE.JS ORB ─── */
  .fixed-orb-container {
    position: fixed;
    top: 0; left: 0; right: 0; height: 45vh; /* Top half of screen */
    z-index: 3;
    display: flex;
    align-items: flex-end; /* Push to bottom of its container */
    justify-content: center;
    padding-bottom: 20px;
    pointer-events: none; /* Let clicks pass through to UI */
    will-change: opacity, transform;
  }

  /* ─── FIXED HOME CONTENT ─── */
  .fixed-home {
    position: fixed;
    top: 45vh; left: 0; right: 0; bottom: 0; /* Bottom half of screen */
    z-index: 10;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start; /* Push to top of its container */
    text-align: center;
    padding: 20px 32px 0 32px;
    pointer-events: none;
    will-change: opacity;
  }

  .home-number {
    font-family: var(--font-title);
    font-size: 110px;
    font-weight: 300;
    line-height: 1;
    margin-bottom: 4px;
    letter-spacing: -2px;
    text-shadow: 0 4px 32px rgba(0,0,0,0.4);
  }

  .home-label {
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 5px;
    color: var(--text-secondary);
    margin-bottom: 20px;
  }

  .home-copy {
    font-family: var(--font-title);
    font-size: 26px;
    font-weight: 400;
    line-height: 1.25;
    color: var(--text-primary);
    margin-bottom: 12px;
  }

  .home-subcopy {
    font-size: 14px;
    color: var(--text-secondary);
    line-height: 1.6;
    max-width: 300px;
  }

  .scroll-cue {
    position: absolute;
    bottom: 40px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 2px;
    color: var(--text-muted);
  }

  .scroll-cue-line {
    width: 1px;
    height: 30px;
    background: linear-gradient(to bottom, var(--text-muted), transparent);
  }

  /* ─── SCROLLING DETAIL CONTENT ─── */
  .scroll-wrapper {
    position: relative;
    z-index: 20;
    width: 100%;
    margin-top: 100vh; /* Start exactly below viewport */
    padding: 0 20px 80px 20px;
  }

  /* ─── GLASS CARDS ─── */
  .glass-card {
    background: var(--glass-bg);
    border: 1px solid var(--glass-border);
    border-top: 1px solid var(--glass-highlight);
    border-radius: 24px;
    padding: 24px;
    backdrop-filter: blur(24px);
    -webkit-backdrop-filter: blur(24px);
    box-shadow: 0 16px 40px rgba(0,0,0,0.3);
    margin-bottom: 16px;
    color: var(--text-primary);
  }

  .card-header {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 16px;
  }
  
  .card-icon {
    width: 24px;
    height: 24px;
    border-radius: 50%;
    background: rgba(255,255,255,0.08);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 10px;
  }

  .card-title-small {
    font-size: 12px;
    font-weight: 500;
    color: var(--text-secondary);
    letter-spacing: 0.5px;
    text-transform: uppercase;
  }

  .card-title-serif {
    font-family: var(--font-title);
    font-size: 28px;
    font-weight: 400;
    margin-bottom: 12px;
  }

  .card-body {
    font-size: 14px;
    line-height: 1.6;
    color: var(--text-secondary);
    margin-bottom: 24px;
  }

  .card-button {
    width: 100%;
    padding: 16px;
    border-radius: 100px;
    background: rgba(255,255,255,0.1);
    border: 1px solid rgba(255,255,255,0.1);
    color: var(--text-primary);
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.5px;
    cursor: pointer;
    backdrop-filter: blur(10px);
    transition: background 0.2s;
  }
  
  .card-button:active { background: rgba(255,255,255,0.15); }

  .stats-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-bottom: 16px;
  }

  .stat-mini-card {
    background: rgba(255,255,255,0.02);
    border: 1px solid rgba(255,255,255,0.05);
    border-radius: 20px;
    padding: 20px 16px;
    text-align: center;
  }

  .stat-mini-val {
    font-family: var(--font-title);
    font-size: 36px;
    margin-bottom: 8px;
  }

  .stat-mini-label {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--text-secondary);
  }

  /* ─── DEVELOPER CONTROLS ─── */
  .dev-controls {
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 100;
    display: flex;
    justify-content: space-between;
    padding: 16px 20px;
    background: linear-gradient(to bottom, rgba(0,0,0,0.6), transparent);
    pointer-events: auto;
  }

  .dev-select-group { display: flex; gap: 8px; }

  select {
    appearance: none;
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 20px;
    color: white;
    padding: 8px 16px;
    font-size: 11px;
    font-weight: 600;
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    outline: none;
    cursor: pointer;
  }
  select option { background: #111; color: white; }

</style>
</head>
<body>

  <!-- BACKGROUNDS -->
  <div class="bg-layer" id="bgLayer"></div>
  <div class="bg-noise"></div>
  
  <!-- FIXED THREE.JS ORB -->
  <div class="fixed-orb-container" id="orbContainer">
    <div id="canvas-container" style="width: 220px; height: 220px;"></div>
  </div>

  <!-- FIXED HOME CONTENT -->
  <div class="fixed-home" id="homeContent">
    <div class="home-number" id="homeNumber">--</div>
    <div class="home-label" id="homeLabel">--</div>
    <div class="home-copy" id="homeCopy">--</div>
    <div class="home-subcopy" id="homeSubcopy">--</div>
    
    <div class="scroll-cue" id="scrollCue">
      Scroll
      <div class="scroll-cue-line"></div>
    </div>
  </div>

  <!-- DEVELOPER CONTROLS -->
  <div class="dev-controls">
    <div class="dev-select-group">
      <select id="stateSelect" onchange="manualUpdate()">
        <option value="Calm & Recovered">Calm & Recovered</option>
        <option value="Mildly Stressed">Mildly Stressed</option>
        <option value="Fatigued">Fatigued</option>
        <option value="Under Load">Under Load</option>
      </select>
    </div>
    <div class="dev-select-group">
      <select id="timeSelect" onchange="manualUpdate()">
        <option value="morning">Morning (Readiness)</option>
        <option value="afternoon">Afternoon (Focus)</option>
        <option value="evening">Evening (Tension)</option>
        <option value="night">Night (Steadiness)</option>
      </select>
    </div>
  </div>

  <!-- SCROLLING DETAIL CONTENT -->
  <div class="scroll-wrapper" id="scrollWrapper">
    
    <div class="glass-card" id="contextCard">
      <div class="card-header">
        <div class="card-icon">⚡</div>
        <div class="card-title-small" id="contextCardTitle">Context</div>
      </div>
      <div class="card-title-serif" id="contextCardHeadline">Review your day</div>
      <div class="card-body" id="contextCardBody">
        Your biometrics show minor signs of something straining your body. Pay attention to how you're feeling today.
      </div>
      <button class="card-button">Learn more</button>
    </div>

    <div class="stats-grid" id="statsGrid">
      <!-- Populated by JS -->
    </div>

    <div class="glass-card">
      <div class="card-header">
        <div class="card-icon">🌙</div>
        <div class="card-title-small">Sleep & Recovery</div>
      </div>
      <div class="card-title-serif" id="sleepTitle">7h 48m</div>
      <div class="card-body" id="sleepBody">
        You hit your target last night. Your body had time to repair and process the load from yesterday.
      </div>
    </div>

  </div>

<script>
// ─── THEMES (Ambient, Subdued Gradients) ────────────
const themes = {
  "Calm & Recovered": {
    bgBase: "#0a100a",
    bgGrad1: "rgba(144,184,136,0.12)", 
    bgGrad2: "rgba(184,212,176,0.06)",
    blobColor: 0x90b888 // Pastel green
  },
  "Mildly Stressed": {
    bgBase: "#100c08",
    bgGrad1: "rgba(212,160,120,0.12)", 
    bgGrad2: "rgba(232,196,160,0.06)", 
    blobColor: 0xd4a078 // Warm orange
  },
  "Fatigued": {
    bgBase: "#0c0a10",
    bgGrad1: "rgba(168,152,192,0.12)", 
    bgGrad2: "rgba(200,192,216,0.06)",
    blobColor: 0xa898c0 // Soft purple
  },
  "Under Load": {
    bgBase: "#100808",
    bgGrad1: "rgba(200,128,112,0.15)", 
    bgGrad2: "rgba(228,176,160,0.08)",
    blobColor: 0xc88070 // Dim red
  }
};

const motionProfiles = {
  "Calm & Recovered": {
    speed: 0.15,     // Very slow, lazy wobble
    intensity: 0.15, // Extremely smooth surface
    exp: 2.0,        // Smooth, wide calm breathing
    amp: 0.08        // Subtle, relaxing expansion
  },
  "Mildly Stressed": {
    speed: 0.6,      
    intensity: 0.45, // More jagged surface
    exp: 6.0,        // Sharper, rushed beat
    amp: 0.09        // Shallower expansion
  },
  "Fatigued": {
    speed: 0.2,      // Sluggish surface
    intensity: 0.2,  // Very flat surface
    exp: 3.0,        
    amp: 0.05        // Weak, shallow beat
  },
  "Under Load": {
    speed: 0.9,      // Fast, but not chaotic wobble
    intensity: 0.55, // Distorted, but not overly spiky
    exp: 8.0,        // Sharp beat, but less aggressive
    amp: 0.12        // Noticeable pounding, but reigned in
  }
};

// ─── DATA MODELS ────────────────────────────────────
const stateData = {
  "Calm & Recovered": {
    bpm: 62, spo2: 98, rmssd: 48, sdnn: 58, stress_index: 1.2, recovery_score: 82,
    sleepDur: "7h 48m", sleepCopy: "You hit your target last night. Your body had time to repair."
  },
  "Mildly Stressed": {
    bpm: 78, spo2: 97, rmssd: 32, sdnn: 40, stress_index: 3.5, recovery_score: 55,
    sleepDur: "6h 15m", sleepCopy: "Just under your target. A consistent bedtime would help."
  },
  "Fatigued": {
    bpm: 65, spo2: 97, rmssd: 38, sdnn: 35, stress_index: 1.5, recovery_score: 24,
    sleepDur: "5h 30m", sleepCopy: "You slept less than your body needs. Recovery will be slower today."
  },
  "Under Load": {
    bpm: 96, spo2: 96, rmssd: 18, sdnn: 22, stress_index: 7.2, recovery_score: 31,
    sleepDur: "6h 42m", sleepCopy: "Just under your target. Autonomic system is working hard."
  }
};

const homeMetricConfig = {
  morning: {
    key: "readiness", label: "READINESS",
    calc: (d) => Math.round(((d.rmssd/100)*40) + (((10-d.stress_index)/10)*40) + (((d.spo2-90)/10)*20)),
    getCopy: (val) => {
      if(val>=75) return { h: "You're primed", s: "Good capacity today. Your body recovered well."};
      if(val>=50) return { h: "You'll be alright", s: "Moderate capacity. Steady effort is fine today."};
      return { h: "Take it slow", s: "Your body needs more rest than your mind thinks."};
    }
  },
  afternoon: {
    key: "focus", label: "FOCUS",
    calc: (d) => Math.round(Math.min((d.rmssd/d.sdnn)*50, 100)),
    getCopy: (val) => {
      if(val>=67) return { h: "Locked in", s: "Good conditions for deep, sustained work."};
      if(val>=34) return { h: "Wandering mind", s: "Moderate coherence. Short breaks will help."};
      return { h: "Scattered state", s: "Avoid demanding cognitive tasks right now."};
    }
  },
  evening: {
    key: "tension", label: "TENSION",
    calc: (d) => Math.round(Math.min((d.stress_index/10)*100, 100)),
    getCopy: (val) => {
      if(val>=67) return { h: "Wound up", s: "High tension carried forward. Wind down intentionally."};
      if(val>=34) return { h: "Lingering load", s: "Some load still present. A walk would help clear it."};
      return { h: "Letting go", s: "Minimal load. Your body handled today well."};
    }
  },
  night: {
    key: "steadiness", label: "STEADINESS",
    calc: (d) => Math.round(Math.min((d.rmssd/100)*100, 100)),
    getCopy: (val) => {
      if(val>=67) return { h: "Winding down", s: "Your nervous system is settling. Good conditions for sleep."};
      if(val>=34) return { h: "Still active", s: "Still some activation. Give it more time to come down."};
      return { h: "Running hot", s: "Body still running hot. Avoid screens and stimulation."};
    }
  }
};

// ─── SCROLL MECHANICS ───────────────────────────────
function handleScroll() {
  const scrollY = window.scrollY;
  const vh = window.innerHeight;
  
  let progress = scrollY / (vh * 0.7); 
  if (progress > 1) progress = 1;
  if (progress < 0) progress = 0;

  // 1. Fade out home text entirely
  const homeContent = document.getElementById('homeContent');
  homeContent.style.opacity = 1 - (progress * 1.5); 

  // 2. Scale & fade orb container (stays in background)
  const orbContainer = document.getElementById('orbContainer');
  orbContainer.style.opacity = 1 - (progress * 0.6); 
  orbContainer.style.transform = `scale(${1 - (progress * 0.25)}) translateY(${scrollY * 0.2}px)`;
}

// ─── UI UPDATE ──────────────────────────────────────
function manualUpdate() {
  const stateSel = document.getElementById('stateSelect').value;
  const timeSel = document.getElementById('timeSelect').value;
  
  const rawData = stateData[stateSel];
  const tConfig = homeMetricConfig[timeSel];
  
  // Theme & Motion updates
  const theme = themes[stateSel];
  const root = document.documentElement.style;
  root.setProperty('--bg-base', theme.bgBase);
  root.setProperty('--bg-gradient-1', theme.bgGrad1);
  root.setProperty('--bg-gradient-2', theme.bgGrad2);

  window.targetProfile = motionProfiles[stateSel];

  // Update WebGL Blob Color
  if (window.blobUniforms && window.blobUniforms.u_color) {
    window.blobUniforms.u_color.value.setHex(theme.blobColor);
  }

  // Home Screen
  const mainVal = tConfig.calc(rawData);
  const copyObj = tConfig.getCopy(mainVal);

  document.getElementById('homeNumber').textContent = mainVal;
  document.getElementById('homeLabel').textContent = tConfig.label;
  document.getElementById('homeCopy').textContent = copyObj.h;
  document.getElementById('homeSubcopy').textContent = copyObj.s;

  // Detail Cards
  document.getElementById('contextCardTitle').textContent = "Symptom Radar";
  document.getElementById('contextCardHeadline').textContent = stateSel === "Calm & Recovered" ? "Looking good" : "Minor signs";
  document.getElementById('contextCardBody').textContent = copyObj.s + " " + (rawData.insight || "Pay attention to your body's signals today.");

  document.getElementById('statsGrid').innerHTML = `
    <div class="stat-mini-card">
      <div class="stat-mini-val">${rawData.bpm}</div>
      <div class="stat-mini-label">Heart Rate</div>
    </div>
    <div class="stat-mini-card">
      <div class="stat-mini-val">${rawData.recovery_score}</div>
      <div class="stat-mini-label">Energy</div>
    </div>
    <div class="stat-mini-card">
      <div class="stat-mini-val">${rawData.rmssd}</div>
      <div class="stat-mini-label">Steadiness</div>
    </div>
    <div class="stat-mini-card">
      <div class="stat-mini-val">${rawData.stress_index}</div>
      <div class="stat-mini-label">Stress Idx</div>
    </div>
  `;

  document.getElementById('sleepTitle').textContent = rawData.sleepDur;
  document.getElementById('sleepBody').textContent = rawData.sleepCopy;
  
  // Update target BPM for blob breathing
  window.targetBpm = rawData.bpm;
}

// ─── THREE.JS BLOB LOGIC ────────────────────────────
window.targetBpm = 60;
window.currentBpm = 60;

window.targetProfile = { speed: 0.3, intensity: 0.25, exp: 2.0, amp: 0.12 };
window.currentProfile = { speed: 0.3, intensity: 0.25, exp: 2.0, amp: 0.12 };
window.accumulatedTime = 0;
window.beatPhase = 0;

window.blobUniforms = {
  u_time: { value: 0 },
  u_intensity: { value: 0.3 }, 
  u_color: { value: null } 
};

const vertexShader = `
uniform float u_intensity;
uniform float u_time;
varying vec2 vUv;
varying float vDisplacement;
varying vec3 vViewPosition;

// Classic Perlin 3D Noise functions
vec4 permute(vec4 x){return mod(((x*34.0)+1.0)*x,289.0);}
vec4 taylorInvSqrt(vec4 r){return 1.79284291400159-0.85373472095314*r;}
vec3 fade(vec3 t){return t*t*t*(t*(t*6.0-15.0)+10.0);}
float cnoise(vec3 P){
  vec3 Pi0=floor(P); vec3 Pi1=Pi0+vec3(1.0); Pi0=mod(Pi0,289.0); Pi1=mod(Pi1,289.0);
  vec3 Pf0=fract(P); vec3 Pf1=Pf0-vec3(1.0); vec4 ix=vec4(Pi0.x,Pi1.x,Pi0.x,Pi1.x);
  vec4 iy=vec4(Pi0.yy,Pi1.yy); vec4 iz0=Pi0.zzzz; vec4 iz1=Pi1.zzzz;
  vec4 ixy=permute(permute(ix)+iy); vec4 ixy0=permute(ixy+iz0); vec4 ixy1=permute(ixy+iz1);
  vec4 gx0=ixy0/7.0; vec4 gy0=fract(floor(gx0)/7.0)-0.5; gx0=fract(gx0);
  vec4 gz0=vec4(0.5)-abs(gx0)-abs(gy0); vec4 sz0=step(gz0,vec4(0.0));
  gx0-=sz0*(step(0.0,gx0)-0.5); gy0-=sz0*(step(0.0,gy0)-0.5);
  vec4 gx1=ixy1/7.0; vec4 gy1=fract(floor(gx1)/7.0)-0.5; gx1=fract(gx1);
  vec4 gz1=vec4(0.5)-abs(gx1)-abs(gy1); vec4 sz1=step(gz1,vec4(0.0));
  gx1-=sz1*(step(0.0,gx1)-0.5); gy1-=sz1*(step(0.0,gy1)-0.5);
  vec3 g000=vec3(gx0.x,gy0.x,gz0.x); vec3 g100=vec3(gx0.y,gy0.y,gz0.y);
  vec3 g010=vec3(gx0.z,gy0.z,gz0.z); vec3 g110=vec3(gx0.w,gy0.w,gz0.w);
  vec3 g001=vec3(gx1.x,gy1.x,gz1.x); vec3 g101=vec3(gx1.y,gy1.y,gz1.y);
  vec3 g011=vec3(gx1.z,gy1.z,gz1.z); vec3 g111=vec3(gx1.w,gy1.w,gz1.w);
  vec4 norm0=taylorInvSqrt(vec4(dot(g000,g000),dot(g010,g010),dot(g100,g100),dot(g110,g110)));
  g000*=norm0.x; g010*=norm0.y; g100*=norm0.z; g110*=norm0.w;
  vec4 norm1=taylorInvSqrt(vec4(dot(g001,g001),dot(g011,g011),dot(g101,g101),dot(g111,g111)));
  g001*=norm1.x; g011*=norm1.y; g101*=norm1.z; g111*=norm1.w;
  float n000=dot(g000,Pf0); float n100=dot(g100,vec3(Pf1.x,Pf0.yz));
  float n010=dot(g010,vec3(Pf0.x,Pf1.y,Pf0.z)); float n110=dot(g110,vec3(Pf1.xy,Pf0.z));
  float n001=dot(g001,vec3(Pf0.xy,Pf1.z)); float n101=dot(g101,vec3(Pf1.x,Pf0.y,Pf1.z));
  float n011=dot(g011,vec3(Pf0.x,Pf1.yz)); float n111=dot(g111,Pf1);
  vec3 fade_xyz=fade(Pf0); vec4 n_z=mix(vec4(n000,n100,n010,n110),vec4(n001,n101,n011,n111),fade_xyz.z);
  vec2 n_yz=mix(n_z.xy,n_z.zw,fade_xyz.y); float n_xyz=mix(n_yz.x,n_yz.y,fade_xyz.x); 
  return 2.2*n_xyz;
}

void main() {
  vUv = uv;
  vDisplacement = cnoise(position + vec3(2.0 * u_time));
  vec3 newPosition = position + normal * (u_intensity * vDisplacement);
  
  vec4 mvPosition = modelViewMatrix * vec4(newPosition, 1.0);
  vViewPosition = -mvPosition.xyz;
  gl_Position = projectionMatrix * mvPosition;
}
`;

const fragmentShader = `
uniform float u_intensity;
uniform float u_time;
uniform vec3 u_color;
varying vec2 vUv;
varying float vDisplacement;
varying vec3 vViewPosition;

void main() {
  // Calculate true normal from displaced geometry
  vec3 dx = dFdx(vViewPosition);
  vec3 dy = dFdy(vViewPosition);
  vec3 normal = normalize(cross(dx, dy));

  // Lighting setup
  vec3 viewDir = normalize(vViewPosition);
  vec3 lightDir = normalize(vec3(1.0, 1.0, 1.0)); // Light from top-right
  
  // Diffuse shading
  float diffuse = max(dot(normal, lightDir), 0.0);
  
  // Specular highlight (shininess)
  vec3 reflectDir = reflect(-lightDir, normal);
  float spec = pow(max(dot(viewDir, reflectDir), 0.0), 64.0);
  
  // Fresnel edge glow
  float fresnel = pow(1.0 - max(dot(normal, viewDir), 0.0), 2.5);
  
  // Combine for thick liquid look
  vec3 baseColor = u_color * (0.3 + 0.7 * diffuse); 
  vec3 rimColor = mix(u_color, vec3(1.0), 0.6); // Lighter tint of base color
  
  vec3 finalColor = baseColor + (rimColor * fresnel * 0.7) + (vec3(1.0) * spec * 0.9);
  
  gl_FragColor = vec4(finalColor, 1.0);
}
`;

function initThreeBlob() {
  if (typeof THREE === 'undefined') {
    console.error("Three.js failed to load.");
    return;
  }
  
  window.blobUniforms.u_color.value = new THREE.Color(0x90b888); // Default

  const container = document.getElementById('canvas-container');
  const scene = new THREE.Scene();
  
  // Camera matches R3F snippet
  const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 100);
  camera.position.z = 8;

  const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
  renderer.setSize(220, 220); // Match original blob container size
  renderer.setPixelRatio(window.devicePixelRatio);
  container.appendChild(renderer.domElement);

  const geometry = new THREE.IcosahedronGeometry(2, 60); // Increased detail for smoother lighting
  const material = new THREE.ShaderMaterial({
    vertexShader,
    fragmentShader,
    uniforms: window.blobUniforms,
    extensions: { derivatives: true }
  });

  const mesh = new THREE.Mesh(geometry, material);
  // Base scale reduced by 20%
  mesh.scale.set(1.2, 1.2, 1.2);
  scene.add(mesh);

  const clock = new THREE.Clock();

  function animate() {
    requestAnimationFrame(animate);
    const delta = clock.getDelta();
    
    // Interpolate motion profile properties
    window.currentProfile.speed += (window.targetProfile.speed - window.currentProfile.speed) * 0.05;
    window.currentProfile.intensity += (window.targetProfile.intensity - window.currentProfile.intensity) * 0.05;
    window.currentProfile.exp += (window.targetProfile.exp - window.currentProfile.exp) * 0.05;
    window.currentProfile.amp += (window.targetProfile.amp - window.currentProfile.amp) * 0.05;

    // Accumulate time for continuous shader wobble
    window.accumulatedTime += delta * window.currentProfile.speed;
    window.blobUniforms.u_time.value = window.accumulatedTime;
    window.blobUniforms.u_intensity.value = window.currentProfile.intensity;
    
    // BPM Heartbeat Logic
    window.currentBpm += (window.targetBpm - window.currentBpm) * 0.05;
    
    // True heartbeat duration (e.g. 60bpm = 1.0s, 120bpm = 0.5s)
    const cycleDur = 60.0 / window.currentBpm;
    
    // Accumulate phase to guarantee smooth beats even when BPM changes
    window.beatPhase += delta / cycleDur;
    if (window.beatPhase > 1.0) window.beatPhase -= 1.0;
    
    // Heartbeat impulse math. sin(phase * PI) gives a 0->1->0 curve.
    // The exponent shapes it into a sharp spike or a soft hill.
    const beat = Math.pow(Math.sin(window.beatPhase * Math.PI), window.currentProfile.exp);
    
    // Scale jumps based on the beat amplitude
    const scale = 1.16 + (window.currentProfile.amp * beat); 
    mesh.scale.set(scale, scale, scale);

    renderer.render(scene, camera);
  }
  
  animate();
}

// ─── INIT ───────────────────────────────────────────
document.addEventListener("DOMContentLoaded", () => {
  const h = new Date().getHours();
  let defaultTime = "morning";
  if(h >= 11 && h < 16) defaultTime = "afternoon";
  if(h >= 16 && h < 20) defaultTime = "evening";
  if(h >= 20 || h < 5) defaultTime = "night";
  document.getElementById('timeSelect').value = defaultTime;

  initThreeBlob(); // Boot up WebGL before manualUpdate runs so uniforms exist
  manualUpdate();
  
  window.addEventListener('scroll', handleScroll, { passive: true });
});
</script>
