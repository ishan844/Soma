<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Soma — V3</title>
<style>
  /* ─── RESET & FONTS ─── */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  
  :root {
    /* Typographic variables mapping to requested fonts */
    --font-title: 'Editorial New', Georgia, 'Times New Roman', serif;
    --font-body: 'Akkurat', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    --font-mono: 'Akkurat Mono', 'SF Mono', Menlo, monospace;

    /* Base Colors - Default to 'Calm & Recovered' (Sunset/Warm tones from inspiration) */
    --bg-base: #1A110C; /* Deep warm brown/black */
    --bg-gradient-1: #8B4513; /* Warm rust/orange */
    --bg-gradient-2: #D2691E; /* Bright orange */
    
    --text-primary: rgba(255, 255, 255, 0.95);
    --text-secondary: rgba(255, 255, 255, 0.65);
    --text-muted: rgba(255, 255, 255, 0.4);

    --glass-bg: rgba(255, 255, 255, 0.04);
    --glass-border: rgba(255, 255, 255, 0.08);
    --glass-highlight: rgba(255, 255, 255, 0.15);
  }

  body {
    font-family: var(--font-body);
    background-color: var(--bg-base);
    color: var(--text-primary);
    min-height: 100vh;
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
    /* Prevent overscroll bounce on fixed layouts */
    overscroll-behavior-y: none; 
  }

  /* ─── RICH BACKGROUND LAYER ─── */
  .bg-layer {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    z-index: 1;
    background: radial-gradient(circle at 50% 30%, var(--bg-gradient-1) 0%, transparent 60%),
                radial-gradient(circle at 80% 80%, var(--bg-gradient-2) 0%, transparent 50%),
                var(--bg-base);
    transition: background 1.5s ease;
  }
  
  /* Noise overlay for texture (like inspiration images) */
  .bg-noise {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    z-index: 2;
    opacity: 0.04;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
    pointer-events: none;
  }

  /* ─── FIXED ORB ─── */
  .fixed-orb-container {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    z-index: 3;
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: none;
    will-change: opacity, transform;
  }

  .orb {
    width: 240px;
    height: 240px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, rgba(255,255,255,0.8), rgba(255,255,255,0.2) 60%, transparent);
    box-shadow: 0 0 80px 20px rgba(255,255,255,0.1), inset 0 0 40px rgba(255,255,255,0.4);
    /* The orb color is heavily influenced by the background behind it due to partial transparency */
    filter: blur(4px);
    will-change: transform;
    opacity: 0.5; /* Base opacity */
  }

  /* ─── FIXED HOME CONTENT ─── */
  .fixed-home {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    z-index: 10;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 0 32px;
    pointer-events: none; /* Let clicks pass through to detail layer if needed */
    will-change: opacity, transform;
  }

  .home-number {
    font-family: var(--font-title);
    font-size: 110px;
    font-weight: 300;
    line-height: 1;
    margin-bottom: 8px;
    letter-spacing: -2px;
    text-shadow: 0 4px 24px rgba(0,0,0,0.3);
  }

  .home-label {
    font-size: 12px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 4px;
    color: var(--text-secondary);
    margin-bottom: 24px;
  }

  .home-copy {
    font-family: var(--font-title);
    font-size: 28px;
    font-weight: 400;
    line-height: 1.2;
    color: var(--text-primary);
    margin-bottom: 12px;
  }

  .home-subcopy {
    font-size: 14px;
    color: var(--text-secondary);
    line-height: 1.5;
    max-width: 280px;
  }

  .scroll-cue {
    position: absolute;
    bottom: 40px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 2px;
    color: var(--text-muted);
  }

  .scroll-cue-line {
    width: 1px;
    height: 40px;
    background: linear-gradient(to bottom, var(--text-muted), transparent);
  }

  /* ─── SCROLLING DETAIL CONTENT ─── */
  .scroll-wrapper {
    position: relative;
    z-index: 20;
    width: 100%;
    /* Start exactly below the initial viewport */
    margin-top: 100vh;
    padding: 0 20px 80px 20px;
  }

  /* ─── GLASS CARDS (Inspired by references) ─── */
  .glass-card {
    background: var(--glass-bg);
    border: 1px solid var(--glass-border);
    border-top: 1px solid var(--glass-highlight); /* Subtle top highlight */
    border-radius: 24px;
    padding: 24px;
    backdrop-filter: blur(24px);
    -webkit-backdrop-filter: blur(24px);
    box-shadow: 0 16px 40px rgba(0,0,0,0.2);
    margin-bottom: 16px;
    color: var(--text-primary);
  }

  /* Detail Card Typography */
  .card-header {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 16px;
  }
  
  .card-icon {
    width: 24px;
    height: 24px;
    border-radius: 50%;
    background: rgba(255,255,255,0.1);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 10px;
  }

  .card-title-small {
    font-size: 13px;
    font-weight: 500;
    color: var(--text-secondary);
    letter-spacing: 0.5px;
  }

  .card-title-serif {
    font-family: var(--font-title);
    font-size: 28px;
    font-weight: 400;
    margin-bottom: 12px;
  }

  .card-body {
    font-size: 14px;
    line-height: 1.6;
    color: var(--text-secondary);
    margin-bottom: 24px;
  }

  .card-button {
    width: 100%;
    padding: 16px;
    border-radius: 100px;
    background: rgba(255,255,255,0.1);
    border: none;
    color: var(--text-primary);
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    backdrop-filter: blur(10px);
  }

  /* Grid for smaller stats */
  .stats-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-bottom: 16px;
  }

  .stat-mini-card {
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(255,255,255,0.05);
    border-radius: 16px;
    padding: 16px;
    text-align: center;
  }

  .stat-mini-val {
    font-family: var(--font-title);
    font-size: 32px;
    margin-bottom: 4px;
  }

  .stat-mini-label {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--text-secondary);
  }

  /* ─── DEVELOPER CONTROLS (FIXED TOP) ─── */
  .dev-controls {
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 100;
    display: flex;
    justify-content: space-between;
    padding: 12px 20px;
    background: linear-gradient(to bottom, rgba(0,0,0,0.4), transparent);
    pointer-events: auto; /* Ensure clicks register */
  }

  .dev-select-group {
    display: flex;
    gap: 8px;
  }

  select {
    appearance: none;
    background: rgba(255,255,255,0.1);
    border: 1px solid rgba(255,255,255,0.2);
    border-radius: 20px;
    color: white;
    padding: 6px 14px 6px 14px;
    font-size: 11px;
    font-weight: 600;
    backdrop-filter: blur(10px);
    outline: none;
    cursor: pointer;
  }
  
  select option {
    background: #222; /* Dark bg for dropdown options to remain readable */
    color: white;
  }

</style>
</head>
<body>

  <!-- FIXED BACKGROUNDS & ORB -->
  <div class="bg-layer" id="bgLayer"></div>
  <div class="bg-noise"></div>
  
  <div class="fixed-orb-container" id="orbContainer">
    <div class="orb" id="orb"></div>
  </div>

  <!-- FIXED HOME CONTENT -->
  <div class="fixed-home" id="homeContent">
    <div class="home-number" id="homeNumber">--</div>
    <div class="home-label" id="homeLabel">--</div>
    <div class="home-copy" id="homeCopy">--</div>
    <div class="home-subcopy" id="homeSubcopy">--</div>
    
    <div class="scroll-cue" id="scrollCue">
      Scroll
      <div class="scroll-cue-line"></div>
    </div>
  </div>

  <!-- DEVELOPER CONTROLS -->
  <div class="dev-controls">
    <div class="dev-select-group">
      <select id="stateSelect" onchange="manualUpdate()">
        <option value="Calm & Recovered">Calm & Recovered</option>
        <option value="Mildly Stressed">Mildly Stressed</option>
        <option value="Fatigued">Fatigued</option>
        <option value="Under Load">Under Load</option>
      </select>
    </div>
    <div class="dev-select-group">
      <select id="timeSelect" onchange="manualUpdate()">
        <option value="morning">Morning (Readiness)</option>
        <option value="afternoon">Afternoon (Focus)</option>
        <option value="evening">Evening (Tension)</option>
        <option value="night">Night (Steadiness)</option>
      </select>
    </div>
  </div>

  <!-- SCROLLING DETAIL CONTENT -->
  <div class="scroll-wrapper" id="scrollWrapper">
    <!-- These cards slide UP over the fixed background -->
    
    <!-- Primary Context Card -->
    <div class="glass-card" id="contextCard">
      <div class="card-header">
        <div class="card-icon">⚡</div>
        <div class="card-title-small" id="contextCardTitle">Context</div>
      </div>
      <div class="card-title-serif" id="contextCardHeadline">Review your day</div>
      <div class="card-body" id="contextCardBody">
        Your biometrics show minor signs of something straining your body. Pay attention to how you're feeling today.
      </div>
      <button class="card-button">Learn more</button>
    </div>

    <!-- Stats Grid -->
    <div class="stats-grid" id="statsGrid">
      <!-- Populated by JS -->
    </div>

    <!-- Recovery/Sleep Area -->
    <div class="glass-card">
      <div class="card-header">
        <div class="card-icon">🌙</div>
        <div class="card-title-small">Sleep & Recovery</div>
      </div>
      <div class="card-title-serif" id="sleepTitle">7h 48m</div>
      <div class="card-body" id="sleepBody">
        You hit your target last night. Your body had time to repair and process the load from yesterday.
      </div>
    </div>

  </div>

<script>
// ─── CONFIG & DEFINITIONS ───────────────────────────

// Themes mimicking rich inspiration images
const themes = {
  "Calm & Recovered": {
    bgBase: "#0A1411", // Deep forest
    bgGrad1: "#1B4D3E", // Rich green
    bgGrad2: "#387B54", // Lighter green glow
  },
  "Mildly Stressed": {
    bgBase: "#1A110C", // Deep brown
    bgGrad1: "#8B4513", // Rust
    bgGrad2: "#D2691E", // Sunset orange
  },
  "Fatigued": {
    bgBase: "#0F111A", // Deep navy/grey
    bgGrad1: "#2B324D", // Muted slate
    bgGrad2: "#4A557A", // Soft blue glow
  },
  "Under Load": {
    bgBase: "#1A0A0A", // Deep dark red/black
    bgGrad1: "#6B1B1B", // Crimson
    bgGrad2: "#A32A2A", // Bright red glow
  }
};

// Static Data Models for Preview
const stateData = {
  "Calm & Recovered": {
    bpm: 62, spo2: 98, rmssd: 48, sdnn: 58, stress_index: 1.2, recovery_score: 82,
    sleepDur: "7h 48m", sleepCopy: "You hit your target last night. Your body had time to repair."
  },
  "Mildly Stressed": {
    bpm: 78, spo2: 97, rmssd: 32, sdnn: 40, stress_index: 3.5, recovery_score: 55,
    sleepDur: "6h 15m", sleepCopy: "Just under your target. A consistent bedtime would help."
  },
  "Fatigued": {
    bpm: 65, spo2: 97, rmssd: 38, sdnn: 35, stress_index: 1.5, recovery_score: 24,
    sleepDur: "5h 30m", sleepCopy: "You slept less than your body needs. Recovery will be slower today."
  },
  "Under Load": {
    bpm: 96, spo2: 96, rmssd: 18, sdnn: 22, stress_index: 7.2, recovery_score: 31,
    sleepDur: "6h 42m", sleepCopy: "Just under your target. Autonomic system is working hard."
  }
};

const homeMetricConfig = {
  morning: {
    key: "readiness",
    label: "READINESS",
    calc: (d) => Math.round(((d.rmssd/100)*40) + (((10-d.stress_index)/10)*40) + (((d.spo2-90)/10)*20)),
    getCopy: (val) => {
      if(val>=75) return { h: "You're primed", s: "Good capacity today. Your body recovered well."};
      if(val>=50) return { h: "You'll be alright", s: "Moderate capacity. Steady effort is fine today."};
      return { h: "Take it slow", s: "Your body needs more rest than your mind thinks."};
    }
  },
  afternoon: {
    key: "focus",
    label: "FOCUS",
    calc: (d) => Math.round(Math.min((d.rmssd/d.sdnn)*50, 100)),
    getCopy: (val) => {
      if(val>=67) return { h: "Locked in", s: "Good conditions for deep, sustained work."};
      if(val>=34) return { h: "Wandering mind", s: "Moderate coherence. Short breaks will help."};
      return { h: "Scattered state", s: "Avoid demanding cognitive tasks right now."};
    }
  },
  evening: {
    key: "tension",
    label: "TENSION",
    calc: (d) => Math.round(Math.min((d.stress_index/10)*100, 100)),
    getCopy: (val) => {
      if(val>=67) return { h: "Wound up", s: "High tension carried forward. Wind down intentionally."};
      if(val>=34) return { h: "Lingering load", s: "Some load still present. A walk would help clear it."};
      return { h: "Letting go", s: "Minimal load. Your body handled today well."};
    }
  },
  night: {
    key: "steadiness",
    label: "STEADINESS",
    calc: (d) => Math.round(Math.min((d.rmssd/100)*100, 100)),
    getCopy: (val) => {
      if(val>=67) return { h: "Winding down", s: "Your nervous system is settling. Good conditions for sleep."};
      if(val>=34) return { h: "Still active", s: "Still some activation. Give it more time to come down."};
      return { h: "Running hot", s: "Body still running hot. Avoid screens and stimulation."};
    }
  }
};

// ─── SCROLL MECHANICS (Parallax / Fade) ─────────────────
function handleScroll() {
  const scrollY = window.scrollY;
  const vh = window.innerHeight;
  
  // Calculate progress based on scrolling down one viewport height
  // progress = 0 at top, 1 when scrolled exactly 100vh
  let progress = scrollY / (vh * 0.8); 
  if (progress > 1) progress = 1;
  if (progress < 0) progress = 0;

  // 1. Fade out the home text content completely
  const homeContent = document.getElementById('homeContent');
  homeContent.style.opacity = 1 - (progress * 1.5); // Fade out faster
  // Push it up slightly to create depth
  homeContent.style.transform = `translateY(${scrollY * 0.4}px)`;

  // 2. Manipulate the Orb
  const orbContainer = document.getElementById('orbContainer');
  // Keep it fixed, but reduce opacity so it becomes a subtle background element
  orbContainer.style.opacity = 1 - (progress * 0.7); 
  // Scale down slightly to push it into the background
  orbContainer.style.transform = `scale(${1 - (progress * 0.2)})`;
}

// ─── UPDATE UI BASED ON TOGGLES ─────────────────────────
function manualUpdate() {
  const stateSel = document.getElementById('stateSelect').value;
  const timeSel = document.getElementById('timeSelect').value;
  
  const rawData = stateData[stateSel];
  const tConfig = homeMetricConfig[timeSel];
  
  // 1. Apply Theme (Background Gradients)
  const theme = themes[stateSel];
  const root = document.documentElement.style;
  root.setProperty('--bg-base', theme.bgBase);
  root.setProperty('--bg-gradient-1', theme.bgGrad1);
  root.setProperty('--bg-gradient-2', theme.bgGrad2);

  // 2. Calculate Home Metric
  const mainVal = tConfig.calc(rawData);
  const copyObj = tConfig.getCopy(mainVal);

  // 3. Update Fixed Home Content
  document.getElementById('homeNumber').textContent = mainVal;
  document.getElementById('homeLabel').textContent = tConfig.label;
  document.getElementById('homeCopy').textContent = copyObj.h;
  document.getElementById('homeSubcopy').textContent = copyObj.s;

  // 4. Update Detail Cards (Context Card)
  document.getElementById('contextCardTitle').textContent = "Symptom Radar";
  document.getElementById('contextCardHeadline').textContent = stateSel === "Calm & Recovered" ? "Looking good" : "Minor signs";
  document.getElementById('contextCardBody').textContent = copyObj.s + " " + (rawData.insight || "Pay attention to your body's signals today.");

  // 5. Update Stats Grid
  const grid = document.getElementById('statsGrid');
  grid.innerHTML = `
    <div class="stat-mini-card">
      <div class="stat-mini-val">${rawData.bpm}</div>
      <div class="stat-mini-label">Heart Rate</div>
    </div>
    <div class="stat-mini-card">
      <div class="stat-mini-val">${rawData.recovery_score}</div>
      <div class="stat-mini-label">Energy</div>
    </div>
    <div class="stat-mini-card">
      <div class="stat-mini-val">${rawData.rmssd}</div>
      <div class="stat-mini-label">Steadiness</div>
    </div>
    <div class="stat-mini-card">
      <div class="stat-mini-val">${rawData.stress_index}</div>
      <div class="stat-mini-label">Stress Idx</div>
    </div>
  `;

  // 6. Update Sleep Card
  document.getElementById('sleepTitle').textContent = rawData.sleepDur;
  document.getElementById('sleepBody').textContent = rawData.sleepCopy;
  
  // Set global target for orb animation
  targetBpm = rawData.bpm;
}

// ─── ORB ANIMATION (rAF) ───────────────────────────────
let currentBpm = 60;
let targetBpm = 60;
let orbPhase = 0;
let lastOrbTime = 0;

function animateOrb(timestamp) {
  if(!lastOrbTime) lastOrbTime = timestamp;
  const dt = (timestamp - lastOrbTime) / 1000;
  lastOrbTime = timestamp;

  // Smoothly interpolate BPM
  currentBpm += (targetBpm - currentBpm) * 0.05;
  
  const cycleDur = Math.max(0.8, Math.min(6.0, 300 / currentBpm));
  const maxScale = 1.15;
  const minScale = 0.95;

  orbPhase += dt / cycleDur;
  if(orbPhase > 1) orbPhase -= 1;

  // Sine wave for breathing
  const t = 0.5 - 0.5 * Math.cos(orbPhase * 2 * Math.PI);
  const scale = minScale + (maxScale - minScale) * t;
  
  const orb = document.getElementById("orb");
  if(orb) {
    orb.style.transform = `scale(${scale})`;
  }

  requestAnimationFrame(animateOrb);
}

// ─── INIT ──────────────────────────────────────────────
document.addEventListener("DOMContentLoaded", () => {
  // Set initial time selection based on actual hour
  const h = new Date().getHours();
  let defaultTime = "morning";
  if(h >= 11 && h < 16) defaultTime = "afternoon";
  if(h >= 16 && h < 20) defaultTime = "evening";
  if(h >= 20 || h < 5) defaultTime = "night";
  document.getElementById('timeSelect').value = defaultTime;

  // Initialize UI
  manualUpdate();

  // Attach scroll listener
  window.addEventListener('scroll', handleScroll, { passive: true });
  
  // Start Orb Animation
  requestAnimationFrame(animateOrb);
});

</script>
</body>
</html>
